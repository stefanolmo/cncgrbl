[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cncdeck"
version = "0.4.2"
description = "Sender G-code per CNC GRBL 1.1 (CNC 1610 Pro e simili) con viewer 3D"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6-Essentials>=6.5", "pyserial>=3.5", "numpy>=1.24", "pyclipper>=1.3", "svgelements>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cncdeck = "cncdeck.__main__:main"

[tool.setuptools]
packages = ["cncdeck"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
